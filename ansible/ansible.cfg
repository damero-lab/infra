# =============================================================================
# Ansible configuration для homelab
#
# Ansible находит этот файл автоматически, если запускать playbook
# из папки ansible/ или ниже.
# =============================================================================

[defaults]
# Где лежит inventory по умолчанию
inventory = inventories/homelab/hosts.yml

# Удалённый пользователь на VM
remote_user = roman

# SSH-ключ для подключения к VM
private_key_file = ~/.ssh/id_ed25519_infra

# Отключить проверку host key (VM создаются заново, ключи меняются)
host_key_checking = False

# Не показывать deprecated warnings
deprecation_warnings = False

# Показывать время выполнения задач
callbacks_enabled = timer, profile_tasks

# Цветной вывод
force_color = True

# Параллельно обрабатывать 5 хостов
forks = 5

# Где искать роли
roles_path = roles

# Не создавать .retry файлы при ошибке
retry_files_enabled = False

[ssh_connection]
# SSH pipelining — ускоряет выполнение (в 2-3 раза)
pipelining = True

# Параметры SSH-соединения
ssh_args = -o ControlMaster=auto -o ControlPersist=60s