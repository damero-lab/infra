# =============================================================================
# Default variables для роли grafana
#
# Grafana в Docker Compose. Визуализирует метрики, которые собирает Prometheus
# (pull-модель, node_exporter :9100). Ставится на VM prom (172.16.0.201) —
# на тот же хост, где уже работает Prometheus.
#
# ВАЖНО: секретов здесь НЕТ. Пароль администратора хранится только в
# Ansible Vault: group_vars/all/vault.yml → vault_grafana_admin_password.
# =============================================================================

# -----------------------------------------------------------------------------
# Где разворачивается стек
# -----------------------------------------------------------------------------
grafana_stack_dir: /opt/grafana

# -----------------------------------------------------------------------------
# Версия Docker-образа
# -----------------------------------------------------------------------------
# Пинуем конкретный тег — не используем :latest (воспроизводимость).
# TODO: сверить актуальный стабильный тег на https://hub.docker.com/r/grafana/grafana/tags
grafana_version: "11.4.0"
grafana_image: "grafana/grafana:{{ grafana_version }}"

# -----------------------------------------------------------------------------
# Порты (на хосте)
# -----------------------------------------------------------------------------
grafana_port: 3000

# -----------------------------------------------------------------------------
# Учётная запись администратора (логин — НЕ секрет; пароль — в Vault)
# -----------------------------------------------------------------------------
grafana_admin_user: admin

# -----------------------------------------------------------------------------
# Источник данных — Prometheus (на этом же хосте)
#
# ВНИМАНИЕ: из контейнера Grafana "localhost" указывает на сам контейнер,
# а не на хост. Поэтому адрес берём из инвентаря (ansible_host), а не localhost.
# -----------------------------------------------------------------------------
grafana_prometheus_port: 9090
grafana_prometheus_url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ grafana_prometheus_port }}"

# -----------------------------------------------------------------------------
# Владелец data-папки — пользователь контейнера Grafana (uid/gid 472).
# Без этого Grafana не сможет писать в /var/lib/grafana.
# -----------------------------------------------------------------------------
grafana_uid: 472
grafana_gid: 472
