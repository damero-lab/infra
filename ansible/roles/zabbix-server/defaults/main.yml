# =============================================================================
# Default variables для роли zabbix-server
#
# Zabbix Server + PostgreSQL + Frontend в Docker Compose.
# Устанавливается на VM mon (172.16.0.200).
# =============================================================================

# -----------------------------------------------------------------------------
# Где разворачивается стек
# -----------------------------------------------------------------------------
zabbix_stack_dir: /opt/zabbix

# -----------------------------------------------------------------------------
# Версии Docker-образов
# -----------------------------------------------------------------------------
# Пинуем конкретный тег — не используем :latest (воспроизводимость).
# 7.0.32 — патч LTS-линии Zabbix 7.0; версия сверена с Docker Hub
#   (zabbix/zabbix-server-pgsql, тег `alpine-7.0.32`).
# При обновлении — менять версию осознанно и прогонять плейбук.
zabbix_version: "7.0.32"
# Postgres тоже пиннут по патч-версии: 16.16 — последний патч линии 16
#   (сверено с официальным манифестом docker-library/official-images).
# В проде дополнительно фиксируют digest (`image@sha256:…`) — тег можно перезаписать.
zabbix_postgres_image: "postgres:16.16-alpine"
zabbix_server_image: "zabbix/zabbix-server-pgsql:alpine-{{ zabbix_version }}"
zabbix_web_image: "zabbix/zabbix-web-nginx-pgsql:alpine-{{ zabbix_version }}"

# -----------------------------------------------------------------------------
# Настройки БД
# -----------------------------------------------------------------------------
zabbix_db_name: zabbix
zabbix_db_user: zabbix
# Пароль — из Ansible Vault (group_vars/vault.yml → vault_zabbix_db_password)
zabbix_db_password: "{{ vault_zabbix_db_password }}"

# -----------------------------------------------------------------------------
# Порты (на хосте)
# -----------------------------------------------------------------------------
zabbix_server_port: 10051       # Zabbix Server — приём метрик от агентов
zabbix_web_port: 8080           # Zabbix Frontend — веб UI

# -----------------------------------------------------------------------------
# Часовой пояс для Frontend
# -----------------------------------------------------------------------------
zabbix_php_timezone: "Europe/Moscow"