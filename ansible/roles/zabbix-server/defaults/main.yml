# =============================================================================
# Default variables для роли zabbix-server
#
# Zabbix Server + PostgreSQL + Frontend в Docker Compose.
# Устанавливается на VM mon (172.16.0.200).
# =============================================================================

# -----------------------------------------------------------------------------
# Где разворачивается стек
# -----------------------------------------------------------------------------
zabbix_stack_dir: /opt/zabbix

# -----------------------------------------------------------------------------
# Версии Docker-образов
# -----------------------------------------------------------------------------
zabbix_version: "7.0"
zabbix_postgres_image: "postgres:16-alpine"
zabbix_server_image: "zabbix/zabbix-server-pgsql:alpine-{{ zabbix_version }}-latest"
zabbix_web_image: "zabbix/zabbix-web-nginx-pgsql:alpine-{{ zabbix_version }}-latest"

# -----------------------------------------------------------------------------
# Настройки БД
# -----------------------------------------------------------------------------
zabbix_db_name: zabbix
zabbix_db_user: zabbix
# Пароль — из Ansible Vault (group_vars/vault.yml → vault_zabbix_db_password)
zabbix_db_password: "{{ vault_zabbix_db_password }}"

# -----------------------------------------------------------------------------
# Порты (на хосте)
# -----------------------------------------------------------------------------
zabbix_server_port: 10051       # Zabbix Server — приём метрик от агентов
zabbix_web_port: 8080           # Zabbix Frontend — веб UI

# -----------------------------------------------------------------------------
# Часовой пояс для Frontend
# -----------------------------------------------------------------------------
zabbix_php_timezone: "Europe/Moscow"