# =============================================================================
# Роль: zabbix-agent — установка Zabbix Agent 2 нативно
#
# Агент собирает метрики хоста (CPU, RAM, диск, сеть, процессы)
# и отправляет на Zabbix Server.
#
# Порядок:
#   1. Зависимости (wget, gnupg, ca-certificates)
#   2. Скачивание .deb пакета zabbix-release
#   3. Установка .deb (автоматически добавляет ключ и репозиторий)
#   4. Установка zabbix-agent2
#   5. Конфиг (Server, Hostname, Port)
#   6. Запуск сервиса
#   7. UFW — открыть 10050 только для Zabbix Server
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Зависимости для работы с репозиторием
# -----------------------------------------------------------------------------
- name: Установить зависимости для работы с репозиторием
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - wget
    state: present
  become: true

# -----------------------------------------------------------------------------
# 2. Скачать .deb пакет релиза Zabbix
# -----------------------------------------------------------------------------
- name: Скачать пакет zabbix-release
  ansible.builtin.get_url:
    url: "{{ zabbix_agent_release_deb_url }}"
    dest: /tmp/zabbix-release.deb
    mode: "0644"
  become: true

# -----------------------------------------------------------------------------
# 3. Установить .deb пакет релиза Zabbix
# -----------------------------------------------------------------------------
- name: Установить пакет zabbix-release
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb
  become: true

# -----------------------------------------------------------------------------
# 4. Установка zabbix-agent2
# -----------------------------------------------------------------------------
- name: Установить zabbix-agent2
  ansible.builtin.apt:
    name: "{{ zabbix_agent_package }}"
    state: present
  become: true

# -----------------------------------------------------------------------------
# 5. Конфиг агента
# -----------------------------------------------------------------------------
- name: Развернуть zabbix_agent2.conf
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: restart zabbix-agent

# -----------------------------------------------------------------------------
# 6. Сервис
# -----------------------------------------------------------------------------
- name: Включить и запустить zabbix-agent2
  ansible.builtin.systemd:
    name: "{{ zabbix_agent_service }}"
    state: started
    enabled: true
  become: true

# -----------------------------------------------------------------------------
# 7. UFW — открыть порт 10050 для Zabbix Server и Docker-подсетей
# -----------------------------------------------------------------------------
- name: Открыть порт 10050 в UFW для Zabbix Server и Docker
  community.general.ufw:
    rule: allow
    port: "{{ zabbix_agent_port }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Zabbix Agent — приём метрик"
  loop:
    - "{{ zabbix_agent_server }}"
    - "172.17.0.0/16"
    - "172.18.0.0/16"
    - "172.19.0.0/16"
  become: true
  when: ufw_enabled | default(false)