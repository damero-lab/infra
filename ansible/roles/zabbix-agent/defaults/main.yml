# =============================================================================
# Default variables для роли zabbix-agent
#
# Установка Zabbix Agent 2 нативно (не в Docker) — нужен доступ к хосту.
# Агент отправляет метрики на Zabbix Server (VM mon).
# =============================================================================

# -----------------------------------------------------------------------------
# Версия Zabbix (должна совпадать с версией Server)
# -----------------------------------------------------------------------------
zabbix_agent_version: "7.0"

# -----------------------------------------------------------------------------
# Репозиторий Zabbix
#
# Astra Linux основана на Debian 12 (bookworm).
# -----------------------------------------------------------------------------
zabbix_agent_apt_release: bookworm
zabbix_agent_apt_repository: "deb [arch=amd64 signed-by=/etc/apt/keyrings/zabbix.asc] https://repo.zabbix.com/zabbix/{{ zabbix_agent_version }}/debian {{ zabbix_agent_apt_release }} main"
zabbix_agent_apt_gpg_key_url: "https://repo.zabbix.com/zabbix-official-repo-apr2024.gpg"
zabbix_agent_apt_gpg_key_path: /etc/apt/keyrings/zabbix.asc

# -----------------------------------------------------------------------------
# Пакет
# -----------------------------------------------------------------------------
zabbix_agent_package: zabbix-agent2

# -----------------------------------------------------------------------------
# Параметры подключения к серверу
# -----------------------------------------------------------------------------
# IP Zabbix Server (VM mon)
zabbix_agent_server: "172.16.0.200"

# Порт агента (по умолчанию 10050)
zabbix_agent_port: 10050

# Порт сервера (по умолчанию 10051)
zabbix_agent_server_port: 10051

# Hostname — используется в Zabbix UI. Совпадает с inventory_hostname.
zabbix_agent_hostname: "{{ inventory_hostname }}"

# -----------------------------------------------------------------------------
# Сервис
# -----------------------------------------------------------------------------
zabbix_agent_service: zabbix-agent2