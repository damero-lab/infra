# =============================================================================
# Default variables для роли zabbix-api
#
# Настройка Zabbix Server через API (создание хостов, обновление IP).
# =============================================================================

# -----------------------------------------------------------------------------
# Подключение к Zabbix API
# -----------------------------------------------------------------------------
# IP Zabbix Server
zabbix_api_host: "172.16.0.200"

# Порт, на котором работает Zabbix Web
zabbix_api_port: 8080

# Путь к API (у нас Zabbix в корне, поэтому "/")
zabbix_api_path: "/"

# Использовать ли HTTPS (у нас HTTP)
zabbix_api_use_ssl: false

# Проверять ли SSL-сертификат (у нас самоподписанный — false)
zabbix_api_validate_certs: false

# Логин и пароль администратора Zabbix
zabbix_api_user: "Admin"
# Пароль берём из Ansible Vault
zabbix_api_password: "{{ vault_zabbix_admin_password }}"

# -----------------------------------------------------------------------------
# Хосты, которые нужно зарегистрировать в Zabbix
#
# Ключ name должен СОВПАДАТЬ с тем, что задано в конфиге агента (Hostname=).
# -----------------------------------------------------------------------------
zabbix_api_hosts:
  - name: "Zabbix server"
    ip: "172.16.0.200"
  - name: "app-01"
    ip: "172.16.0.211"

# -----------------------------------------------------------------------------
# Параметры для создаваемых хостов
# -----------------------------------------------------------------------------
# В какую группу добавлять хосты в Zabbix
zabbix_api_host_group: "Linux servers"

# Какой шаблон привязывать (собирает метрики CPU, RAM, диски)
zabbix_api_template: "Linux by Zabbix agent"

# Порт, на котором слушает агент
zabbix_api_agent_port: 10050