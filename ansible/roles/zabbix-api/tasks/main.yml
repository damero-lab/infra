# =============================================================================
# Роль: zabbix-api (Прямой вызов через ansible.builtin.uri)
#
# Порядок:
#   1. Дождаться, что API отвечает (apiinfo.version — без авторизации).
#   2. Авторизоваться паролем Admin из Vault.
#   3. Если пароль не подошёл (свежая БД) — bootstrap: войти дефолтным паролем
#      образа, сменить его на пароль из Vault, войти заново.
#   4. Группа/шаблон/хосты (ниже).
#
# Зачем bootstrap: официальный образ Zabbix создаёт БД с ДЕФОЛТНЫМ паролем Admin
# (zabbix_api_default_admin_password). Пароль из Vault при init БД никто не
# кладёт, поэтому на свежей VM (после destroy) он не подходит. Раньше «работало»
# лишь потому, что пароль был выставлен вне кода и жил в БД — destroy его стирает.
# Теперь пароль Admin приводится к состоянию из Vault кодом (идемпотентно).
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Готовность API (apiinfo.version не требует авторизации)
# -----------------------------------------------------------------------------
- name: Дождаться готовности Zabbix API
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "apiinfo.version"
      params: []
      id: 0
    status_code: 200
  register: zabbix_api_probe
  until: zabbix_api_probe.status | default(0) == 200
  retries: 30
  delay: 10
  changed_when: false

# -----------------------------------------------------------------------------
# 2. Авторизация паролем Admin из Vault
# -----------------------------------------------------------------------------
- name: Авторизация в Zabbix API (пароль из Vault)
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "user.login"
      params:
        username: "{{ zabbix_api_admin_user }}"
        password: "{{ vault_zabbix_admin_password }}"
      id: 1
    status_code: 200
  register: zabbix_auth
  changed_when: false

# -----------------------------------------------------------------------------
# 3. Bootstrap пароля Admin на свежей БД (пароль из Vault ещё не подходит)
# -----------------------------------------------------------------------------
- name: Bootstrap пароля администратора Zabbix
  when: (zabbix_auth.json.result | default('')) | length == 0
  block:
    - name: Войти дефолтным паролем образа Zabbix
      ansible.builtin.uri:
        url: "http://172.16.0.200:8080/api_jsonrpc.php"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "user.login"
          params:
            username: "{{ zabbix_api_admin_user }}"
            password: "{{ zabbix_api_default_admin_password }}"
          id: 2
        status_code: 200
      register: zabbix_auth_default
      changed_when: false
      until: (zabbix_auth_default.json.result | default('')) | length > 0
      retries: 30
      delay: 10

    - name: Получить ID пользователя Admin
      ansible.builtin.uri:
        url: "http://172.16.0.200:8080/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_auth_default.json.result }}"
        body:
          jsonrpc: "2.0"
          method: "user.get"
          params:
            filter:
              username: "{{ zabbix_api_admin_user }}"
          id: 3
        status_code: 200
      register: zabbix_admin_info
      changed_when: false

    - name: Сменить пароль Admin на пароль из Vault
      ansible.builtin.uri:
        url: "http://172.16.0.200:8080/api_jsonrpc.php"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_auth_default.json.result }}"
        body:
          jsonrpc: "2.0"
          method: "user.update"
          params:
            userid: "{{ zabbix_admin_info.json.result[0].userid }}"
            passwd: "{{ vault_zabbix_admin_password }}"
          id: 4
        status_code: 200
      changed_when: true

    - name: Повторный вход уже паролем из Vault
      ansible.builtin.uri:
        url: "http://172.16.0.200:8080/api_jsonrpc.php"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "user.login"
          params:
            username: "{{ zabbix_api_admin_user }}"
            password: "{{ vault_zabbix_admin_password }}"
          id: 5
        status_code: 200
      register: zabbix_auth
      changed_when: false

- name: Проверить, что авторизация в Zabbix API прошла
  ansible.builtin.assert:
    that: (zabbix_auth.json.result | default('')) | length > 0
    success_msg: "Zabbix API: авторизация OK"
    fail_msg: >-
      Не удалось авторизоваться в Zabbix API: ни паролем из Vault, ни дефолтным
      ({{ zabbix_api_default_admin_password }}). Проверь vault_zabbix_admin_password в Vault.

- name: Получить ID группы хостов
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ zabbix_auth.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "hostgroup.get"
      params:
        filter:
          name: "{{ zabbix_api_host_group }}"
      id: 2
    status_code: 200
  register: zabbix_group

- name: Получить ID шаблона
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ zabbix_auth.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "template.get"
      params:
        filter:
          host: "{{ zabbix_api_template }}"
      id: 3
    status_code: 200
  register: zabbix_template

- name: Проверить, существует ли уже хост
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ zabbix_auth.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "host.get"
      params:
        filter:
          host: "{{ item.name }}"
      id: 4
    status_code: 200
  register: existing_host
  loop: "{{ zabbix_api_hosts }}"

- name: Сформировать список имен уже существующих хостов
  ansible.builtin.set_fact:
    existing_host_names: "{{ existing_host.results | selectattr('json.result', 'defined') | selectattr('json.result', 'ne', []) | map(attribute='item.name') | list }}"

- name: Обновить существующий хост (например, изменить 127.0.0.1 на 172.16.0.200)
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ zabbix_auth.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "host.update"
      params:
        hostid: "{{ item.json.result[0].hostid }}"
        interfaces:
          - type: 1
            main: 1
            useip: 1
            ip: "{{ item.item.ip }}"
            dns: ""
            port: "{{ zabbix_api_agent_port }}"
      id: 5
    status_code: 200
  loop: "{{ existing_host.results }}"
  when: item.json.result | length > 0

- name: Создать новый хост (если его еще нет)
  ansible.builtin.uri:
    url: "http://172.16.0.200:8080/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ zabbix_auth.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "host.create"
      params:
        host: "{{ item.name }}"
        interfaces:
          - type: 1
            main: 1
            useip: 1
            ip: "{{ item.ip }}"
            dns: ""
            port: "{{ zabbix_api_agent_port }}"
        groups:
          - groupid: "{{ zabbix_group.json.result[0].groupid }}"
        templates:
          - templateid: "{{ zabbix_template.json.result[0].templateid }}"
      id: 6
    status_code: 200
  loop: "{{ zabbix_api_hosts }}"
  when: item.name not in existing_host_names