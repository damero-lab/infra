# =============================================================================
# Роль: zabbix-api
#
# Создаёт/обновляет хосты в Zabbix Server через API.
# =============================================================================

- name: Зарегистрировать и обновить хосты в Zabbix через API
  community.zabbix.zabbix_host:
    host_name: "{{ item.name }}"
    visible_name: "{{ item.name }}"

    host_groups:
      - "{{ zabbix_api_host_group }}"

    link_templates:
      - "{{ zabbix_api_template }}"

    status: enabled
    state: present

    interfaces:
      - type: 1
        main: 1
        useip: 1
        ip: "{{ item.ip }}"
        dns: ""
        port: "{{ zabbix_api_agent_port }}"

    # --- ПРЯМОЕ ПОДКЛЮЧЕНИЕ (обходим баг плагина httpapi) ---
    server_url: "http://172.16.0.200:8080"
    login_user: "Admin"
    login_password: "{{ vault_zabbix_admin_password }}"
    # --------------------------------------------------------

  loop: "{{ zabbix_api_hosts }}"