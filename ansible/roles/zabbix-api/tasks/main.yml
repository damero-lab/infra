# =============================================================================
# Роль: zabbix-api
#
# Создаёт/обновляет хосты в Zabbix Server через API.
# Использует HTTPAPI-плагин (ансибл-переменные с префиксом ansible_).
# =============================================================================

- name: Зарегистрировать и обновить хосты в Zabbix через API
  community.zabbix.zabbix_host:
    host_name: "{{ item.name }}"
    visible_name: "{{ item.name }}"

    host_groups:
      - "{{ zabbix_api_host_group }}"

    link_templates:
      - "{{ zabbix_api_template }}"

    status: enabled
    state: present

    interfaces:
      - type: 1          # 1 = Agent
        main: 1
        useip: 1
        ip: "{{ item.ip }}"
        dns: ""
        port: "{{ zabbix_api_agent_port }}"

  loop: "{{ zabbix_api_hosts }}"

  # Параметры подключения для HTTPAPI-плагина
  vars:
    ansible_host: "{{ zabbix_api_host }}"
    ansible_user: "{{ zabbix_api_user }}"
    ansible_password: "{{ zabbix_api_password }}"
    ansible_network_os: community.zabbix.zabbix
    ansible_httpapi_use_ssl: "{{ zabbix_api_use_ssl }}"
    ansible_httpapi_validate_certs: "{{ zabbix_api_validate_certs }}"