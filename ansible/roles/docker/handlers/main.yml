# =============================================================================
# Handlers для роли docker
#
# Хендлер вызывается, когда задача меняет daemon.json.
# Перезапуск применяет новые настройки.
# =============================================================================

- name: restart docker
  ansible.builtin.systemd:
    name: "{{ docker_service_name }}"
    state: restarted
  become: true