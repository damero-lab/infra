# =============================================================================
# Default variables для роли prometheus
#
# Prometheus в Docker Compose. Собирает метрики с node_exporter (:9100)
# со всех хостов группы astra.
# Устанавливается на VM prom (172.16.0.201).
# =============================================================================

# -----------------------------------------------------------------------------
# Где разворачивается стек
# -----------------------------------------------------------------------------
prometheus_stack_dir: /opt/prometheus

# -----------------------------------------------------------------------------
# Версия Docker-образа
# -----------------------------------------------------------------------------
# TODO: сверить актуальный стабильный тег на https://hub.docker.com/r/prom/prometheus/tags
prometheus_version: "v3.1.0"
prometheus_image: "prom/prometheus:{{ prometheus_version }}"

# -----------------------------------------------------------------------------
# Порты (на хосте)
# -----------------------------------------------------------------------------
prometheus_port: 9090

# -----------------------------------------------------------------------------
# Параметры сбора метрик
# -----------------------------------------------------------------------------
prometheus_scrape_interval: "15s"
prometheus_retention: "15d"

# Порт node_exporter на целевых хостах (роль node_exporter)
prometheus_node_exporter_port: 9100