# =============================================================================
# Default variables для роли node_exporter
#
# Агент отдаёт метрики хоста (CPU, RAM, диск, сеть) по HTTP на порту 9100.
# Prometheus (VM prom) забирает их отсюда (pull-модель).
#
# Установка нативная бинарником из официального GitHub-релиза —
# в Debian/Astra пакета node_exporter в репозитории нет.
# =============================================================================
# -----------------------------------------------------------------------------
# Версия и платформа (обновление — сменой переменной)
# -----------------------------------------------------------------------------
node_exporter_version: "1.8.2"
node_exporter_arch: "amd64"
# -----------------------------------------------------------------------------
# Пользователь и пути
#
# Выделенный системный юзер без shell и домашнего каталога — принцип
# наименьших привилегий: агент не запускается от root.
# -----------------------------------------------------------------------------
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_bin: /usr/local/bin/node_exporter
node_exporter_tmp_dir: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
# -----------------------------------------------------------------------------
# Скачивание
# -----------------------------------------------------------------------------
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
# -----------------------------------------------------------------------------
# Порт и сервис
# -----------------------------------------------------------------------------
node_exporter_port: 9100
node_exporter_service: node_exporter
# -----------------------------------------------------------------------------
# Источники, которым разрешён доступ к метрикам (UFW).
#
# Только Prometheus (VM prom = 172.16.0.201). Остальным — закрыто.
# -----------------------------------------------------------------------------
node_exporter_allowed_sources:
  - "172.16.0.201"