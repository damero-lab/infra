# =============================================================================
# Handlers для роли common
#
# Handlers вызываются через `notify` из tasks/.
# Запускаются ОДИН РАЗ в конце плейбука, даже если notify был несколько раз.
# =============================================================================

- name: restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  become: true