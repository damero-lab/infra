# =============================================================================
# Default variables для роли common
#
# Значения используются, если НЕ переопределены в group_vars/ или хостовых
# переменных. Приоритет: defaults < group_vars < host_vars < --extra-vars.
#
# Реальные значения для homelab заданы в
# ansible/inventories/homelab/group_vars/all.yml.
# =============================================================================

# -----------------------------------------------------------------------------
# Часовой пояс
# -----------------------------------------------------------------------------
timezone: UTC

# -----------------------------------------------------------------------------
# NTP (синхронизация времени)
# -----------------------------------------------------------------------------
ntp_package: chrony
ntp_service: chrony

# -----------------------------------------------------------------------------
# Базовые пакеты
#
# Минимальный набор — расширяется в group_vars при необходимости.
# -----------------------------------------------------------------------------
base_packages:
  - curl
  - git
  - vim

# -----------------------------------------------------------------------------
# SSH hardening
#
# Значения заданы как строки (YAML: "no" — строка, no — boolean).
# -----------------------------------------------------------------------------
ssh_permit_root_login: "prohibit-password"
ssh_password_authentication: "no"

# -----------------------------------------------------------------------------
# UFW (firewall)
#
# По умолчанию ВЫКЛЮЧЕН — чтобы случайно не отрезать SSH на VM,
# где group_vars не применялись. Включается явно через group_vars.
# -----------------------------------------------------------------------------
ufw_enabled: false
ufw_default_policy: deny
ufw_allowed_ports:
  - { port: "22", proto: "tcp", comment: "SSH" }