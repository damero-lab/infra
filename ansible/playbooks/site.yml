# =============================================================================
# Главный playbook homelab
#
# Применяет роли на группы хостов.
#
# Запуск:
#   ansible-playbook playbooks/site.yml              # всё на всех
#   ansible-playbook playbooks/site.yml -l mon       # только на mon
#   ansible-playbook playbooks/site.yml -l app-01    # только на app-01
#   ansible-playbook playbooks/site.yml --check      # проверка без изменений
# =============================================================================

# -----------------------------------------------------------------------------
# Базовая настройка всех VM (common + docker)
# -----------------------------------------------------------------------------
- name: Базовая настройка всех VM
  hosts: astra
  become: true
  gather_facts: true

  roles:
    - common
    - docker
    - zabbix-agent

# -----------------------------------------------------------------------------
# Zabbix Server — только на monitoring VM
# -----------------------------------------------------------------------------
- name: Развернуть Zabbix на monitoring VM
  hosts: mon
  become: true
  gather_facts: true

  roles:
    - zabbix-server