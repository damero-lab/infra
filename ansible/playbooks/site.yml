# =============================================================================
# Главный playbook homelab
# =============================================================================

# Блок 0: Ожидание готовности VM.
#
# Зачем: `terraform apply` завершается, как только Proxmox отчитался, что VM
# СОЗДАНЫ и started=true. Это «процесс запущен», а НЕ «ОС загрузилась». Astra
# Linux + cloud-init + sshd поднимаются десятки секунд — минуты, поэтому без
# ожидания первый play падает на сборе фактов:
#     "ssh: connect to host <IP> port 22: Connection refused"  (sshd ещё не слушает)
#     "ssh: connect to host <IP> port 22: Connection timed out" (VM ещё грузится)
#
# Готовность идёт в ДВЕ стадии, и обе надо переждать:
#   1) SSH поднялся (sshd слушает порт 22);
#   2) cloud-init завершил первый запуск и отпустил блокировку dpkg.
#      Иначе SSH уже есть, но задачи apt падают с:
#        "Unable to acquire the dpkg frontend lock (/var/lib/dpkg/lock-frontend),
#         is another process using it?"
#      (ssh-порт открыт, а cloud-init ещё ставит пакеты и держит блокировку).
#
# Ожидание — ответственность Ansible (конфигурация), а не Terraform (провижининг).
- name: Ожидание готовности VM (SSH + cloud-init)
  hosts: astra            # mon, prom, app-01 — все целевые VM в этой группе
  gather_facts: false     # факты соберёт следующий play, уже по живому SSH

  tasks:
    # --- Стадия 1: SSH -------------------------------------------------------
    - name: Ждать, пока поднимется SSH на VM
      ansible.builtin.wait_for_connection:
        delay: 5            # первая попытка через 5 c после старта play
        timeout: 600        # ждать до 10 мин (холодный старт Astra + cloud-init)
        sleep: 5            # пауза между попытками
        connect_timeout: 5  # таймаут одной попытки подключения

    # --- Стадия 2: cloud-init и блокировка dpkg ------------------------------
    - name: Проверить, установлен ли cloud-init
      ansible.builtin.stat:
        path: /usr/bin/cloud-init
      register: cloud_init_bin

    # `cloud-init status --wait` блокируется до завершения первого запуска VM.
    # Статус degraded-done (для облачных образов Astra это норма) отдаёт
    # ненулевой код, но настройку не ломает — поэтому не считаем это ошибкой.
    # timeout в 10 мин — страховка, чтобы не зависнуть на «зависшем» cloud-init.
    - name: Ждать завершения cloud-init
      ansible.builtin.command: timeout 600 cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: false
      when: cloud_init_bin.stat.exists

    # Подстраховка: если блокировку держит не cloud-init, а unattended-upgrades
    # или apt-daily. Ждём до 5 минут, затем задача честно падает.
    #
    # Почему shell-цикл, а не `command` + `until`: `fuser` возвращает НЕнулевой rc,
    # когда блокировка СВОБОДНА (это признак успеха), но модуль `command` считает
    # ненулевой rc ошибкой задачи, а `until` управляет лишь повторами — итог всё
    # равно FAILED. Цикл ниже делает проверку явной: лок свободен → exit 0.
    - name: Ждать освобождения блокировки dpkg
      ansible.builtin.shell: |
        for _ in $(seq 1 60); do
          fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || exit 0
          sleep 5
        done
        echo "dpkg lock still held after 300s" >&2
        exit 1
      changed_when: false
      become: true

# Блок 1: Базовая настройка всех VM
- name: Базовая настройка всех VM
  hosts: astra
  become: true
  gather_facts: true

  roles:
    - common
    - docker
    - zabbix-agent
    - node_exporter       # ← агент метрик на все VM (в стеке Prometheus)
    
# Блок 2: Zabbix Server на mon
- name: Развернуть Zabbix на monitoring VM
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - zabbix-server

# Блок 3: Настройка хостов в Zabbix через API
- name: Настроить хосты в Zabbix через API
  hosts: zabbix_api
  gather_facts: false

  roles:
    - zabbix-api

# Блок 4: Prometheus на prom
- name: Развернуть Prometheus на prometheus VM
  hosts: prometheus_server
  become: true
  gather_facts: true

  roles:
    - prometheus

# Блок 5: Grafana на prom (визуализация метрик из Prometheus)
- name: Развернуть Grafana на prometheus VM
  hosts: prometheus_server
  become: true
  gather_facts: true

  roles:
    - grafana
