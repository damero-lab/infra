# =============================================================================
# Главный playbook homelab
# =============================================================================

# Блок 1: Базовая настройка всех VM
- name: Базовая настройка всех VM
  hosts: astra
  become: true
  gather_facts: true

  roles:
    - common
    - docker
    - zabbix-agent

# Блок 2: Zabbix Server на mon
- name: Развернуть Zabbix на monitoring VM
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - zabbix-server

# Блок 3: Настройка хостов в Zabbix через API
- name: Настроить хосты в Zabbix через API
  hosts: zabbix_api
  gather_facts: false

  roles:
    - zabbix-api