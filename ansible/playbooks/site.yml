# =============================================================================
# Главный playbook homelab
#
# Применяет все роли на все хосты (или на конкретную группу).
#
# Запуск:
#   ansible-playbook playbooks/site.yml
#
# Только на группу:
#   ansible-playbook playbooks/site.yml -l astra
#
# Только на хост:
#   ansible-playbook playbooks/site.yml -l app-01
#
# Проверка без изменений (dry-run):
#   ansible-playbook playbooks/site.yml --check
# =============================================================================

- name: Базовая настройка всех VM
  hosts: astra
  become: true
  gather_facts: true

  roles:
    - common