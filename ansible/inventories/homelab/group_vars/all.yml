# =============================================================================
# Общие переменные для ВСЕХ хостов homelab.
#
# Используются ролью common (roles/common/defaults/main.yml).
# Здесь — конкретные значения. В defaults — их дефолты.
# =============================================================================

# -----------------------------------------------------------------------------
# Часовой пояс и время
# -----------------------------------------------------------------------------
timezone: Europe/Moscow
ntp_package: chrony
ntp_service: chrony

# -----------------------------------------------------------------------------
# Базовые пакеты — установятся на каждой VM
# -----------------------------------------------------------------------------
base_packages:
  - git
  - curl
  - wget
  - vim
  - nano
  - htop
  - tree
  - net-tools
  - jq
  - python3-pip
  - python3-venv

# -----------------------------------------------------------------------------
# SSH hardening
# -----------------------------------------------------------------------------
ssh_permit_root_login: prohibit-password   # root только по ключу
ssh_password_authentication: "no"          # только ключи, не пароли

# -----------------------------------------------------------------------------
# UFW — firewall
# -----------------------------------------------------------------------------
ufw_enabled: true
ufw_default_policy: deny                    # запрещать входящие по умолчанию
ufw_allowed_ports:
  - { port: "22",   proto: "tcp", comment: "SSH" }
  - { port: "80",   proto: "tcp", comment: "HTTP (для будущих сервисов)" }
  - { port: "443",  proto: "tcp", comment: "HTTPS (для будущих сервисов)" }