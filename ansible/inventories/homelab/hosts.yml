# =============================================================================
# Inventory для homelab
# =============================================================================

all:
  children:
    # Группа для обычных VM (SSH)
    astra:
      hosts:
        app-01:
          ansible_host: 172.16.0.211
        mon:
          ansible_host: 172.16.0.200

    # Виртуальный хост для работы с Zabbix API (HTTP)
    zabbix_api:
      hosts:
        zabbix_server:
          ansible_host: 172.16.0.200
          ansible_port: 8080
          ansible_httpapi_port: 8080      # <-- ДОБАВИТЬ
          ansible_httpapi_path: ""         # <-- ДОБАВИТЬ
          ansible_connection: httpapi
          ansible_network_os: community.zabbix.zabbix
          ansible_httpapi_use_ssl: false
          ansible_httpapi_validate_certs: false
          ansible_user: "Admin"
          ansible_password: "{{ vault_zabbix_admin_password }}"