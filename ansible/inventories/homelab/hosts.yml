# =============================================================================
# Inventory для homelab
#
# Список VM с их параметрами. Ansible подключается к ним по SSH.
#
# ВАЖНО: этот файл пока пишется вручную. Позже автоматизируем —
# inventory будет генерироваться из Terraform output (см. docs/).
#
# Структура:
# - all            — все хосты
#   - astra        — группа хостов Astra Linux
#     - app-01     — конкретная VM (тестовая)
#     - mon        — конкретная VM (мониторинг)
# =============================================================================

all:
  children:
    astra:
      hosts:
        app-01:
          ansible_host: 172.16.0.211
        mon:
          ansible_host: 172.16.0.200